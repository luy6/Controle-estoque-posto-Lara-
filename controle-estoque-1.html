<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Estoque</title>
<style>
:root{
  --bg:#171b21; --panel:#20262f; --panel2:#272e39; --line:#333c49;
  --text:#eef1f5; --muted:#8b96a5; --amber:#e2a63b; --green:#4caf7d; --red:#e0555c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#login{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg); z-index:50; padding:24px;
}
.login-box{width:100%; max-width:340px; text-align:center;}
.logo-login{
  width:200px; max-width:72%; height:auto; margin:0 auto 22px;
  display:block; filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));
}
.login-box h1{font-size:20px; font-weight:600; margin:0 0 4px;}
.login-box p{color:var(--muted); font-size:14px; margin:0 0 20px;}
.login-box input{
  width:100%; padding:14px 16px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); color:var(--text); font-size:18px; text-align:center;
  letter-spacing:4px; margin-bottom:12px;
}
.login-box button, .btn{
  border:none; border-radius:10px; padding:13px 18px; font-size:15px; font-weight:600;
  cursor:pointer; color:#171b21; background:var(--amber);
}
.login-box button{width:100%;}
#erro{color:var(--red); font-size:13px; height:18px; margin-top:2px;}

#app{display:none; max-width:480px; margin:0 auto; padding:18px 16px 60px;}
header{margin-bottom:16px; display:flex; align-items:center; gap:12px;}
.logo-header{height:44px; width:auto; flex-shrink:0; filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));}
header h1{font-size:19px; margin:0 0 2px;}
header .sub{color:var(--muted); font-size:13px;}

.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
.card h2{font-size:14px; margin:0 0 12px; color:var(--muted); font-weight:600;}

.status-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.badge{padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600;}
.badge.on{background:rgba(76,175,125,.18); color:var(--green);}
.badge.off{background:rgba(224,85,92,.18); color:var(--red);}

.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
.grid3 div{background:var(--panel2); border-radius:10px; padding:10px 8px; text-align:center;}
.grid3 .n{font-size:16px; font-weight:700;}
.grid3 .l{font-size:11px; color:var(--muted); margin-top:2px;}

.pagtos{margin-top:12px; border-top:1px solid var(--line); padding-top:10px;}
.pag-row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0;}
.pag-row span:first-child{color:var(--muted);}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:10px;}
.field label{font-size:12px; color:var(--muted);}
.field input{
  padding:10px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--panel2); color:var(--text); font-size:14px;
}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

.item{border-top:1px solid var(--line); padding:12px 0;}
.item:first-child{border-top:none; padding-top:0;}
.item-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.item-top .nome{font-weight:600; font-size:14.5px;}
.item-top .qtd{font-size:13px; color:var(--muted);}
.item-top .qtd b{color:var(--text);}
.item-actions{display:flex; gap:6px; align-items:center;}
.item-actions input{
  width:56px; padding:9px 6px; text-align:center; border-radius:8px; border:1px solid var(--line);
  background:var(--panel2); color:var(--text); font-size:14px;
}
.item-pag{display:flex; align-items:center; gap:8px; margin-top:6px;}
.item-pag label{font-size:11px; color:var(--muted); white-space:nowrap;}
.item-pag select{
  flex:1; padding:8px; border-radius:8px; border:1px solid var(--line);
  background:var(--panel2); color:var(--text); font-size:13px;
}
.mini{flex:1; padding:9px 4px; font-size:12.5px; font-weight:600; border-radius:8px; border:none; cursor:pointer;}
.mini.entrada{background:rgba(76,175,125,.18); color:var(--green);}
.mini.venda{background:rgba(226,166,59,.18); color:var(--amber);}
.mini.avaria{background:rgba(224,85,92,.18); color:var(--red);}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:10px 0;}
.item-top .cat{color:var(--muted); font-weight:400; font-size:12.5px;}
.item-manage{display:flex; gap:14px; margin-top:8px;}
.link{background:none; border:none; padding:0; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;}
.link.del{color:var(--red);}
.btn.secundario{background:var(--panel2); color:var(--text);}

.hist-item{border-top:1px solid var(--line); padding:10px 0; font-size:13px;}
.hist-item:first-child{border-top:none;}
.hist-item .d{color:var(--muted); font-size:12px; margin-bottom:4px;}
.full{width:100%;}
</style>
</head>

    <div>
      <h1>Estoque</h1>
      <div class="sub" id="dataHoje"></div>
    </div>
  </header>

  <div class="card">
    <div class="status-row">
      <span class="badge" id="badgeDia">—</span>
      <button class="btn" id="btnDia" onclick="alternarDia()">—</button>
    </div>
    <div class="grid3">
      <div><div class="n" id="totalRestante">R$0</div><div class="l">total em estoque</div></div>
      <div><div class="n" id="vendidoHoje">R$0</div><div class="l">vendido hoje</div></div>
      <div><div class="n" id="avariaHoje">R$0</div><div class="l">avarias hoje</div></div>
    </div>
    <div class="pagtos" id="pagamentosHoje"></div>
  </div>

  <div class="card">
    <h2>Adicionar produto</h2>
    <div class="field"><label>Nome</label><input id="novoNome" placeholder="Ex: Refrigerante 2L"></div>
    <div class="field"><label>Categoria</label><input id="novoCategoria" placeholder="Ex: Bebidas"></div>
    <div class="row2">
      <div class="field"><label>Qtd inicial</label><input id="novoQtd" type="number" min="0"></div>
      <div class="field"><label>Preço custo</label><input id="novoCusto" type="number" min="0" step="0.01"></div>
    </div>
    <div class="field"><label>Preço de venda</label><input id="novoVenda" type="number" min="0" step="0.01"></div>
    <button class="btn full" onclick="adicionarProduto()">Adicionar ao estoque</button>
  </div>

  <div class="card">
    <h2>Produtos</h2>
    <div id="listaProdutos"></div>
  </div>

  <div class="card">
    <h2>Histórico de dias fechados</h2>
    <div id="listaHistorico"></div>
    <button class="btn full secundario" style="margin-top:10px;" onclick="exportarHistorico()">Exportar histórico (Excel/CSV)</button>
  </div>
</div>

<script>
const SENHA = "1234";

function carregar(key, def){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function salvarLS(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let produtos = carregar('estoque_produtos', []);
let dia = carregar('estoque_dia', {aberto:false, abertura:null, vendas:0, avarias:0, pagamentos:null});
if(!dia.pagamentos) dia.pagamentos = criarPagamentos();
let historico = carregar('estoque_historico', []);

function criarPagamentos(){
  return {
    dinheiro:{qtd:0, valor:0}, pix:{qtd:0, valor:0},
    debito:{qtd:0, valor:0}, credito:{qtd:0, valor:0}
  };
}
const LABELS_PAGAMENTO = {dinheiro:'Dinheiro', pix:'Pix', debito:'Cartão débito', credito:'Cartão crédito'};

function salvar(){
  salvarLS('estoque_produtos', produtos);
  salvarLS('estoque_dia', dia);
  salvarLS('estoque_historico', historico);
}

function fmt(v){ return 'R$' + (Math.round(v*100)/100).toFixed(2).replace('.',','); }

function tentarEntrar(){
  const val = document.getElementById('senhaInput').value;
  if(val === SENHA){
    sessionStorage.setItem('estoque_unlocked','1');
    mostrarApp();
  } else {
    document.getElementById('erro').textContent = 'Senha incorreta';
  }
}
document.getElementById('senhaInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tentarEntrar(); });

function mostrarApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('dataHoje').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
  render();
}
if(sessionStorage.getItem('estoque_unlocked')==='1') mostrarApp();

function alternarDia(){
  if(!dia.aberto){
    dia = {aberto:true, abertura:new Date().toISOString(), vendas:0, avarias:0, pagamentos:criarPagamentos()};
  } else {
    const totalEstoque = produtos.reduce((s,p)=>s+p.qtd*p.venda,0);
    historico.unshift({
      abertura: dia.abertura, fechamento: new Date().toISOString(),
      vendas: dia.vendas, avarias: dia.avarias, estoqueFinal: totalEstoque,
      pagamentos: dia.pagamentos
    });
    dia = {aberto:false, abertura:null, vendas:0, avarias:0, pagamentos:criarPagamentos()};
  }
  salvar(); render();
}

function adicionarProduto(){
  const nome = document.getElementById('novoNome').value.trim();
  const categoria = document.getElementById('novoCategoria').value.trim();
  const qtd = parseFloat(document.getElementById('novoQtd').value)||0;
  const custo = parseFloat(document.getElementById('novoCusto').value)||0;
  const venda = parseFloat(document.getElementById('novoVenda').value)||0;
  if(!nome){ alert('Digite o nome do produto'); return; }
  produtos.push({id:Date.now(), nome, categoria, qtd, custo, venda});
  document.getElementById('novoNome').value='';
  document.getElementById('novoCategoria').value='';
  document.getElementById('novoQtd').value='';
  document.getElementById('novoCusto').value='';
  document.getElementById('novoVenda').value='';
  salvar(); render();
}

let editingId = null;

function iniciarEdicao(id){ editingId = id; render(); }
function cancelarEdicao(){ editingId = null; render(); }

function salvarEdicao(id){
  const p = produtos.find(x=>x.id===id);
  if(!p) return;
  const nome = document.getElementById('edit_nome_'+id).value.trim();
  const categoria = document.getElementById('edit_cat_'+id).value.trim();
  const custo = parseFloat(document.getElementById('edit_custo_'+id).value)||0;
  const venda = parseFloat(document.getElementById('edit_venda_'+id).value)||0;
  if(!nome){ alert('Digite o nome do produto'); return; }
  p.nome = nome; p.categoria = categoria; p.custo = custo; p.venda = venda;
  editingId = null;
  salvar(); render();
}

function removerProduto(id){
  if(!confirm('Remover este produto do estoque?')) return;
  produtos = produtos.filter(p=>p.id!==id);
  salvar(); render();
}

function exportarHistorico(){
  if(historico.length===0){ alert('Nenhum dia fechado para exportar ainda.'); return; }
  let csv = 'Data;Vendido;Avarias;Estoque final;Dinheiro (qtd);Pix (qtd);Debito (qtd);Credito (qtd)\n';
  historico.forEach(h=>{
    const d = new Date(h.fechamento).toLocaleDateString('pt-BR');
    const pg = h.pagamentos || criarPagamentos();
    csv += `${d};${h.vendas.toFixed(2)};${h.avarias.toFixed(2)};${h.estoqueFinal.toFixed(2)};${pg.dinheiro.qtd};${pg.pix.qtd};${pg.debito.qtd};${pg.credito.qtd}\n`;
  });
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'historico-estoque.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function movimentar(id, tipo){
  const p = produtos.find(x=>x.id===id);
  if(!p) return;
  const input = document.getElementById('mov_'+id);
  const qtd = parseFloat(input.value);
  if(!qtd || qtd<=0){ alert('Informe uma quantidade válida'); return; }

  if(tipo==='entrada'){
    p.qtd += qtd;
  } else {
    if(!dia.aberto){ alert('Abra o dia antes de registrar vendas ou avarias.'); return; }
    if(qtd > p.qtd){ alert('Quantidade maior que o estoque disponível.'); return; }
    p.qtd -= qtd;
    if(tipo==='venda'){
      dia.vendas += qtd * p.venda;
      const metodo = document.getElementById('pag_'+id).value;
      if(!dia.pagamentos) dia.pagamentos = criarPagamentos();
      dia.pagamentos[metodo].qtd += 1;
      dia.pagamentos[metodo].valor += qtd * p.venda;
    }
    if(tipo==='avaria') dia.avarias += qtd * p.custo;
  }
  input.value='';
  salvar(); render();
}

function render(){
  const totalRestante = produtos.reduce((s,p)=>s+p.qtd*p.venda,0);
  document.getElementById('totalRestante').textContent = fmt(totalRestante);
  document.getElementById('vendidoHoje').textContent = fmt(dia.vendas);
  document.getElementById('avariaHoje').textContent = fmt(dia.avarias);

  const badge = document.getElementById('badgeDia');
  const btn = document.getElementById('btnDia');
  if(dia.aberto){
    badge.textContent='Dia aberto'; badge.className='badge on';
    btn.textContent='Fechar dia';
  } else {
    badge.textContent='Dia fechado'; badge.className='badge off';
    btn.textContent='Abrir dia';
  }

  const pg = dia.pagamentos || criarPagamentos();
  document.getElementById('pagamentosHoje').innerHTML = Object.keys(LABELS_PAGAMENTO).map(k=>
    `<div class="pag-row"><span>${LABELS_PAGAMENTO[k]}</span><span>${pg[k].qtd}x · ${fmt(pg[k].valor)}</span></div>`
  ).join('');

  const lista = document.getElementById('listaProdutos');
  if(produtos.length===0){
    lista.innerHTML = '<div class="empty">Nenhum produto cadastrado ainda.</div>';
  } else {
    lista.innerHTML = produtos.map(p=>{
      if(p.id===editingId){
        return `
        <div class="item">
          <div class="field"><label>Nome</label><input id="edit_nome_${p.id}" value="${p.nome}"></div>
          <div class="field"><label>Categoria</label><input id="edit_cat_${p.id}" value="${p.categoria||''}"></div>
          <div class="row2">
            <div class="field"><label>Preço custo</label><input id="edit_custo_${p.id}" type="number" min="0" step="0.01" value="${p.custo}"></div>
            <div class="field"><label>Preço venda</label><input id="edit_venda_${p.id}" type="number" min="0" step="0.01" value="${p.venda}"></div>
          </div>
          <div class="row2">
            <button class="btn full" onclick="salvarEdicao(${p.id})">Salvar</button>
            <button class="btn full secundario" onclick="cancelarEdicao()">Cancelar</button>
          </div>
        </div>`;
      }
      return `
      <div class="item">
        <div class="item-top">
          <span class="nome">${p.nome}${p.categoria ? ' <span class="cat">· '+p.categoria+'</span>' : ''}</span>
          <span class="qtd">restante: <b>${p.qtd}</b> · venda ${fmt(p.venda)}</span>
        </div>
        <div class="item-actions">
          <input id="mov_${p.id}" type="number" min="0" placeholder="qtd">
          <button class="mini entrada" onclick="movimentar(${p.id},'entrada')">+ Entrada</button>
          <button class="mini venda" onclick="movimentar(${p.id},'venda')">Venda</button>
          <button class="mini avaria" onclick="movimentar(${p.id},'avaria')">Avaria</button>
        </div>
        <div class="item-pag">
          <label>Pagamento (venda)</label>
          <select id="pag_${p.id}">
            <option value="dinheiro">Dinheiro</option>
            <option value="pix">Pix</option>
            <option value="debito">Cartão débito</option>
            <option value="credito">Cartão crédito</option>
          </select>
        </div>
        <div class="item-manage">
          <button class="link" onclick="iniciarEdicao(${p.id})">Editar</button>
          <button class="link del" onclick="removerProduto(${p.id})">Remover</button>
        </div>
      </div>`;
    }).join('');
  }

  const hist = document.getElementById('listaHistorico');
  if(historico.length===0){
    hist.innerHTML = '<div class="empty">Nenhum dia fechado ainda.</div>';
  } else {
    hist.innerHTML = historico.map(h=>{
      const d = new Date(h.fechamento).toLocaleDateString('pt-BR');
      const p = h.pagamentos || criarPagamentos();
      const linhaPag = Object.keys(LABELS_PAGAMENTO)
        .filter(k=>p[k].qtd>0)
        .map(k=>`${LABELS_PAGAMENTO[k]} ${p[k].qtd}x`)
        .join(' · ') || 'Sem vendas registradas';
      return `<div class="hist-item">
        <div class="d">${d}</div>
        Vendido: ${fmt(h.vendas)} &nbsp;·&nbsp; Avarias: ${fmt(h.avarias)} &nbsp;·&nbsp; Estoque final: ${fmt(h.estoqueFinal)}
        <div style="color:var(--muted); font-size:12px; margin-top:4px;">${linhaPag}</div>
      </div>`;
    }).join('');
  }
}
</script>
</body>
</html>
